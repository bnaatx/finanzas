<title>Mis Finanzas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#123F44;--mut:#4F7377;--bg:#FFF8F0;--tq:#8ACDCB;--tqd:#08807B;--soft:#E3F3F1;--soft2:#DDF7F5;--line:#CFE6E4;--pri:var(--tq);--pri-tx:#fff;--nav-bg:#fff;--nav-tx:#000;--nav-on:#000;--num:inherit;--caja-blu:#D44B86;--caja-h2:#CA88DD;--caja-h2-tx:#fff;--caja-sueldo:#0A3C9C;--bar-hi:#F78CA8;--bar-lo:#FADADD;--m1:#8ACDCB;--m2:#FFB48C}
:root[data-tema="azul"]{--ink:#173B64;--mut:#4A6585;--bg:#F6FAFF;--tq:#173B64;--tqd:#173B64;--soft:#E4EEFA;--soft2:#EAF2FC;--line:#C8DAF0;--pri:#FFDE70;--pri-tx:#173B64;--nav-bg:#173B64;--nav-tx:#fff;--nav-on:#FFDE70;--num:#FFDE70;--caja-h2:#CA88DD;--caja-h2-tx:#fff;--caja-sueldo:#173B64;--bar-hi:#FFDE70;--bar-lo:#A3C4EB;--m1:#173B64;--m2:#FFDE70}
.btn.pri{background:var(--pri);color:var(--pri-tx)}
.hero.h2c{background:var(--caja-h2);color:var(--caja-h2-tx)}.hero.h2c .back{color:inherit}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}
.m{color:var(--mut);font-size:12px}
#app{max-width:480px;margin:0 auto;padding-bottom:110px;min-height:100vh}
.hero{position:relative;overflow:hidden;background:var(--tq);color:#fff;border-radius:0 0 36px 36px;padding:calc(env(safe-area-inset-top) + 26px) 20px 24px}
.o{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);width:220px;height:220px;right:-70px;top:-80px}
.hero>*:not(.o){position:relative}
.pad{padding:16px 20px 0;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:24px;padding:16px;box-shadow:0 6px 18px rgba(18,63,68,.08)}
.row{display:flex;align-items:center;gap:12px}
.btn{height:48px;border:0;border-radius:16px;background:var(--tq);color:#fff;font-weight:800;font-size:15px;padding:0 18px}
.btn.out{background:#fff;border:1.5px solid var(--ink);color:var(--ink)}
.btn.dash{background:none;border:1.5px dashed var(--tqd);color:var(--tqd);border-radius:24px}
.btn.dng{background:#fff;border:1.5px solid #C0392B;color:#C0392B}
.grid3{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.grid3>*{grid-column:span 2}.grid3>.w3{grid-column:span 3}.grid3>.w6{grid-column:span 6}
.caja,.cajab{text-shadow:0 1px 2px rgba(0,0,0,.28)}
.caja{color:#fff;border-radius:22px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;border:0;text-align:left;min-height:104px}
.caja b{font-size:13.5px;font-weight:800;white-space:nowrap}
.caja .t{font-size:12px;font-weight:700;display:flex;justify-content:space-between}
.caja .s{font-size:10.5px;font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sec b{font-size:16px}
.fj{display:flex;align-items:center;gap:12px;height:46px;border-top:1px solid var(--soft)}
.fj:first-child{border-top:0}
.chip{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.chip img{width:22px;height:22px;object-fit:contain;display:block}
.chip.full{overflow:hidden;box-shadow:inset 0 0 0 1px rgba(18,63,68,.08)}
.chip.full img{width:100%;height:100%;object-fit:cover}
.fj .tx{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;color:inherit}
.fj .tx b{font-size:14px;display:block;font-weight:700}
.fj .tx .m{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fj .amt{font-size:14px;font-weight:800}
.fj input[type=checkbox]{width:22px;height:22px;margin:0 0 0 4px;accent-color:var(--tqd);flex:none}
.fj.ok .tx b,.fj.ok .amt{text-decoration:line-through;opacity:.55}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom) + 12px);pointer-events:none}
.nav>div{pointer-events:auto;width:100%;max-width:448px;height:66px;background:var(--nav-bg);border-radius:28px;box-shadow:0 8px 24px rgba(18,63,68,.14);display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--nav-tx);min-width:64px;padding:0}
.nav button.on{font-weight:800;color:var(--nav-on)}
.back{background:none;border:0;color:inherit;font-weight:600;font-size:13px;padding:0 0 6px}
.seg{display:flex;background:rgba(255,255,255,.28);border-radius:14px;padding:3px;margin-top:12px}
.seg button{flex:1;height:34px;border:0;border-radius:11px;background:none;color:#fff;font-weight:700;font-size:13px}
.seg button.on{background:#fff;color:var(--ink)}
.mv{display:flex;align-items:center;gap:10px;min-height:46px;border-top:1px solid var(--soft);padding:4px 0}
.mv:first-child{border-top:0}
.mv .tx{flex:1;min-width:0}.mv .tx b{font-size:13.5px;font-weight:700}
.tag{background:var(--soft);font-size:10px;font-weight:800;border-radius:8px;padding:2px 7px;margin-left:6px}
.pos{color:var(--tqd)}
.bar{display:flex;height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
.note{background:var(--soft2);border-radius:14px;padding:10px 12px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.sheet-bg{position:fixed;inset:0;background:rgba(18,63,68,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:18px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--mut)}
.inp{height:48px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;width:100%}
.big{font-size:28px;font-weight:800;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cc{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink);display:flex;gap:6px;align-items:center}
.cc.on{border-color:var(--ink);background:var(--soft)}
.tgl{display:flex;gap:8px}.tgl button{flex:1;height:44px;border-radius:14px;border:1.5px solid var(--ink);background:#fff;font-weight:800;color:var(--ink)}
.tgl button.on{background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:700;z-index:99;max-width:90%}
.donut{width:150px;height:150px;border-radius:50%;flex:none;position:relative}
.donut i{position:absolute;inset:26px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.bars span{width:100%;border-radius:8px 8px 4px 4px;min-height:4px}
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 60px) 24px 24px;display:flex;flex-direction:column;gap:14px}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px}
code{background:var(--soft);border-radius:8px;padding:2px 6px;font-size:11.5px;word-break:break-all}
.pre{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:11.5px;word-break:break-all;user-select:all}
.tope{background:#fff;border-radius:24px;padding:14px 16px;box-shadow:0 6px 18px rgba(18,63,68,.08)}
.tope .pb{height:12px;border-radius:6px;background:var(--soft);overflow:hidden;margin:8px 0 6px}
.tope .pb i{display:block;height:100%;border-radius:6px}
.mini{font-size:11px;font-weight:700;color:var(--mut)}
.ck{display:flex;flex-direction:row;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--ink)}
.ck input{width:20px;height:20px;accent-color:var(--tqd)}
</style>
</head>
<body>
<div id="app"></div>

async function cargar(){
  const u=S.user.id;
  const q=t=>sb.from(t).select("*");
  const [cfg,cats,movs,fijos,pagos,metas,aps,cjs,cjm,tpg,trs,est]=await Promise.all([
    q("fin_config").eq("user_id",u).maybeSingle(),q("fin_cats").order("orden"),q("fin_movs").order("fecha",{ascending:false}).order("creado",{ascending:false}).range(0,4999),
    q("fin_fijos").eq("activo",true).order("orden"),q("fin_pagos"),q("fin_metas"),q("fin_aportes").order("fecha",{ascending:false}),q("fin_cajitas").eq("activo",true).order("orden"),q("fin_cajita_movs").order("fecha",{ascending:false}),q("fin_tarjeta_pagos").order("fecha",{ascending:false}),q("fin_traspasos").order("fecha",{ascending:false}),sb.from("estado").select("dominio,j")]);
  for(const r of [cfg,cats,movs,fijos,pagos,metas,aps]) if(r.error) throw r.error;
  S.cfg=cfg.data;
  if(!S.cfg){const ins=await sb.from("fin_config").insert({user_id:u,nombre:(S.user.email||"").split("@")[0]}).select().single();if(ins.error)throw ins.error;S.cfg=ins.data}
  aplicarTema(S.cfg.tema);S.cats=cats.data;S.movs=movs.data;S.fijos=fijos.data;S.pagos=pagos.data;S.metas=metas.data;S.aportes=aps.data;S.cajitas=cjs.error?[]:cjs.data;S.cmovs=cjm.error?[]:cjm.data;S.tpagos=tpg.error?[]:tpg.data;S.traspasos=trs.error?[]:trs.data;
  if(!S.cats.length){const base=[["Comida","#E91E63"],["Transporte","#A7D8DB"],["Gimnasio","#FFE08A"],["Cuidado personal","#FFD1B6"],["Suscripciones","#F78CA8"],["Uber y moto","#F4A261"],["Otros","#FADADD"]];
    const r=await sb.from("fin_cats").insert(base.map((c,i)=>({nombre:c[0],color:c[1],orden:i+1}))).select();if(!r.error)S.cats=r.data}
  S.h2=est.error?null:calcH2(est.data||[]);
}

/* Hornea2: misma cuenta que usa la app de Hornea2 en la pantalla de Caja */
function calcH2(rows){
  const d={};rows.forEach(r=>{try{d[r.dominio]=JSON.parse(r.j)}catch(e){d[r.dominio]={}}});
  const vs=(d.ventas&&d.ventas.ventas)||[],cj=d.caja||{},pr=d.precios||{};
  const may=pr.may||[],mayV=pr.mayV||[],vip=pr.vip||[],pm=pr.pm||{p:5000,k:7000};
  const tabla=c=>vip.includes(c)?mayV:may;
  const tier=(n,tb)=>{const a=[...(tb.length?tb:may)].sort((x,y)=>x.d-y.d);let t=a[0];a.forEach(z=>{if(n>=z.d)t=z});return t};
  const precio=(t,s,tot,c)=>{if(t==="menor")return s==="Kinder"?pm.k:pm.p;const z=tier(tot,tabla(c));return s==="Kinder"?z.k:s==="Nutella"?z.n:z.p};
  const venta=x=>x.q*precio(x.t,x.s,x.tot||x.q,x.c);
  const por=m=>sum(vs.filter(x=>x.p===m),venta);
  const ini=cj.ini||{ef:0,nu:0},rate=+cj.nuRate||0,desde=cj.nuDesde||hoy();
  const dias=diasEntre(desde,hoy());
  const nb=ini.nu*Math.pow(1+rate/100,dias/365);
  const ef=ini.ef+por("Efectivo"),nu=nb+por("Nu"),deb=por("Debe");
  // ventas agrupadas por pedido (g), de la más nueva a la más vieja
  const gr=[];vs.forEach(x=>{const k=x.g+"|"+x.p;let g=gr.find(z=>z.k===k);if(!g){g={k,c:x.c,l:x.l,p:x.p,d:x.d||"",q:0,v:0};gr.push(g)}g.q+=x.q;g.v+=venta(x)});
  return {ef,nu,deb,rate,gnu:nb-ini.nu,total:ef+nu,movs:gr.slice(0,8)};
}

/* Blu Gestión: solo lectura (pedidos entregados/cobrados e inversiones desde la fecha base) */
async function cargarBlu(){
  if(!S.cfg||!S.cfg.blu_activo)return;
  const {data:{session}}=await bluSb.auth.getSession();
  if(!session){S.blu={estado:"login",saldo:null,movs:[],msg:""};return}
  S.blu.estado="cargando";
  let rows=[];
  for(let from=0;;from+=1000){
    const r=await bluSb.from("registros").select("coleccion,id,data").in("coleccion",["pedidos","inversiones"]).range(from,from+999);
    if(r.error){S.blu={estado:"err",saldo:null,movs:[],msg:r.error.message};return}
    rows=rows.concat(r.data);if(r.data.length<1000)break;
  }
  const desde=S.cfg.blu_desde,tasa=S.cfg.tasa_blu;
  const modoEnvio=p=>p.envioModo||(p.envioPaga==="yo"?"blu":"contado");
  const pedSub=p=>(p.lineas||[]).reduce((a,l)=>a+l.cantidad*l.precio,0);
  const pedTotal=p=>pedSub(p)+(modoEnvio(p)==="contado"?(+p.envio||0):0);
  const pagoDe=p=>p.pago||(p.pagado?"pagado":"pendiente");
  const saldoP=p=>pagoDe(p)==="pagado"?0:Math.max(0,pedTotal(p)-(pagoDe(p)==="abono"?(+p.abono||0):0));
  const ms=[],snap={},ex=S.cfg.blu_excluir||{};
  rows.forEach(r=>{const x=r.data;if(!x||!x.fecha||x.fecha<desde)return;const key=r.coleccion+":"+r.id,ya=+ex[key]||0;
    if(r.coleccion==="pedidos"&&x.estado!=="perdido"){const cob=pedTotal(x)-saldoP(x);snap[key]=cob;const t="Venta · "+(x.cliente||"Pedido"),sb2="Pedido #"+(x.n||"");if(ya>0)ms.push({f:x.fecha,t,s:sb2,v:ya,inc:true});const nuevo=cob-ya;if(nuevo>0)ms.push({f:x.fecha,t,s:sb2,v:nuevo})}
    if(r.coleccion==="inversiones"){const v=+x.valor||0;snap[key]=-v;const t="Compra · "+(x.descripcion||"Inversión"),sb2=x.categoria||"";if(ya<0)ms.push({f:x.fecha,t,s:sb2,v:ya,inc:true});const nuevo=-v-ya;if(nuevo<0)ms.push({f:x.fecha,t,s:sb2,v:nuevo})}});
  ms.sort((a,b)=>b.f.localeCompare(a.f));
  const saldo=crece(S.cfg.blu_base,tasa,dayOf(S.cfg.blu_ts||desde))+sum(ms.filter(m=>!m.inc),m=>crece(m.v,tasa,m.f));
  S.blu={estado:"ok",saldo,snap,movs:ms,entro:sum(ms.filter(m=>m.v>0),m=>m.v),salio:-sum(ms.filter(m=>m.v<0),m=>m.v),msg:""};
}
const saldoBlu=()=>S.blu.saldo!=null?S.blu.saldo:(S.cfg?crece(S.cfg.blu_base,S.cfg.tasa_blu,dayOf(S.cfg.blu_ts||S.cfg.blu_desde)):0);
const sueldoNom=()=>S.cfg&&S.cfg.sueldo_nombre||"Sueldo BDB";
function aplicarTema(t){
  const r=document.documentElement;if(t&&t!=="turquesa")r.dataset.tema=t;else delete r.dataset.tema;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="azul"?"#173B64":"#8ACDCB";
}
function saldoSueldo(){
  const c=S.cfg,ts=new Date(c.sueldo_ts).getTime(),d0=dayOf(c.sueldo_ts);
  return crece(c.sueldo_base,c.tasa_sueldo,d0)+sum(S.movs.filter(m=>new Date(m.creado).getTime()>ts&&(!m.origen||m.origen==="sueldo")&&!["efectivo","tarjeta nu"].includes(medioDe(m))),m=>(m.tipo==="ingreso"?1:-1)*crece(+m.monto,c.tasa_sueldo,m.fecha))
    -sum(S.cmovs.filter(x=>+x.monto>0&&new Date(x.creado).getTime()>ts),x=>crece(+x.monto,c.tasa_sueldo,x.fecha))
    -sum((S.tpagos||[]).filter(x=>x.origen==="sueldo"&&new Date(x.creado).getTime()>ts),x=>crece(+x.monto,c.tasa_sueldo,x.fecha));
}
/* Efectivo y tarjeta de crédito Nu (Abre Caminos). Los medios se comparan sin importar mayúsculas */
/* Medios de pago: con qué se pagó (Nequi, DaviPlata, Bancolombia, Nu, Efectivo, Tarjeta Nu). Es aparte de "de qué plata salió" (origen) */
const MEDIOS=[["Efectivo","#3E9B6F"],["Nequi","#C8147F"],["DaviPlata","#E5322D"],["Bancolombia","#3B3B40"],["Banco de Bogotá","#00569E"],["Nu","#8A05BE"]];
const medioDe=m=>{const x=(m.medio||m.origen||"").trim().toLowerCase();return ["efectivo","nequi","daviplata","bancolombia","banco de bogotá","bdb","nu","tarjeta nu"].includes(x)?x:""};
const esOrg=(m,n)=>medioDe(m)===n;
/* Mi dinero: cada cuenta tiene un saldo real (lo ajustas tú) y desde ahí suma ingresos, resta gastos y pagos de la tarjeta, y mueve traspasos */
const cuentaBase=k=>k==="efectivo"?{base:+S.cfg.efectivo_base||0,ts:S.cfg.efectivo_ts}:((S.cfg.cuentas||{})[k]||{base:0,ts:S.cfg.efectivo_ts});
const cuentaTs=k=>new Date(cuentaBase(k).ts).getTime();
const pagoMedio=x=>(x.medio||x.origen||"").trim().toLowerCase();
const trMonto=(x,k)=>(x.a.toLowerCase()===k?1:0)*+x.monto-(x.de.toLowerCase()===k?1:0)*+x.monto;
const saldoCuenta=k=>{const t=cuentaTs(k);return (+cuentaBase(k).base||0)+sum(S.movs.filter(m=>esOrg(m,k)&&new Date(m.creado).getTime()>t),m=>(m.tipo==="ingreso"?1:-1)*+m.monto)+sum((S.traspasos||[]).filter(x=>new Date(x.creado).getTime()>t),x=>trMonto(x,k))-sum((S.tpagos||[]).filter(x=>pagoMedio(x)===k&&new Date(x.creado).getTime()>t),x=>+x.monto)};
const saldoEfectivo=()=>saldoCuenta("efectivo");
const movsTj=()=>{const ts=new Date(S.cfg.tarjeta_ts).getTime();return S.movs.filter(m=>m.tipo==="gasto"&&esOrg(m,"tarjeta nu")&&new Date(m.creado).getTime()>ts)};
const pagosTj=()=>{const ts=new Date(S.cfg.tarjeta_ts).getTime();return (S.tpagos||[]).filter(x=>new Date(x.creado).getTime()>ts)};
const deudaTarjeta=()=>Math.max(0,(+S.cfg.tarjeta_deuda_base||0)+sum(movsTj(),m=>+m.monto)-sum(pagosTj(),x=>+x.monto));
const tarjetaOn=()=>+S.cfg.tarjeta_cupo>0;
/* Cajitas propias (Keratina, Mantenimiento gym...): aportes suman, usos restan, y crecen */
/* texto oscuro sobre colores claros, blanco sobre oscuros */
const onColor=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h||"");if(!m)return"#fff";const n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>165?"#123F44":"#fff"};
const saldoCaja=cj=>sum(S.cmovs.filter(x=>x.cajita_id===cj.id),x=>crece(+x.monto,cj.tasa,x.fecha));
/* Tope semanal: de lunes a domingo, solo gastos variables (sin fijos ni gastos especiales) */
function semanaTope(){
  const n=dd(hoy());const l=new Date(n);l.setDate(l.getDate()-((l.getDay()+6)%7));const a=iso(l);const e=new Date(l);e.setDate(e.getDate()+6);const b=iso(e);
  const gastado=sum(S.movs.filter(m=>m.tipo==="gasto"&&!m.fijo_id&&!m.especial&&m.fecha>=a&&m.fecha<=b),m=>+m.monto);
  const uber=sum(S.movs.filter(m=>m.tipo==="gasto"&&!m.fijo_id&&!m.especial&&m.cat==="Uber y moto"&&m.fecha>=a&&m.fecha<=b),m=>+m.monto);
  return {a,b,gastado,uber};
}

/* Marcar un gasto fijo como pagado: crea el gasto (restando de Sueldo BDB); desmarcar lo deshace */
async function togglePago(fid,chk){
  const f=S.fijos.find(x=>x.id===fid),ym=mesAct();
  if(chk){
    let monto=+f.monto;
    if(f.moneda==="USD"){const v=prompt("¿Cuánto fue en pesos? (US$"+f.monto+" al dólar de hoy)",S.cfg.trm?Math.round(f.monto*S.cfg.trm):"");if(v===null){render();return}monto=num(v);if(!(monto>0)){render();return}
      const trm=monto/f.monto;S.cfg.trm=trm;sb.from("fin_config").update({trm}).eq("user_id",S.user.id).then(()=>{})}
    const m=await sb.from("fin_movs").insert({tipo:"gasto",monto,cat:f.cat,nota:f.nombre+" (fijo)",fijo_id:f.id}).select().single();
    if(m.error){toast("No se pudo guardar");render();return}
    const p=await sb.from("fin_pagos").insert({fijo_id:f.id,mes:ym,mov_id:m.data.id}).select().single();
    if(p.error){await sb.from("fin_movs").delete().eq("id",m.data.id);toast("No se pudo guardar");render();return}
    S.movs.unshift(m.data);S.pagos.push(p.data);toast(f.nombre+" pagado");
  }else{
    const p=S.pagos.find(x=>x.fijo_id===fid&&x.mes===ym);
    if(p){if(p.mov_id)await sb.from("fin_movs").delete().eq("id",p.mov_id);await sb.from("fin_pagos").delete().eq("fijo_id",fid).eq("mes",ym);
      S.movs=S.movs.filter(m=>m.id!==p.mov_id);S.pagos=S.pagos.filter(x=>x!==p)}
  }
  render();
}

/* ---------- Estadísticas ---------- */
function rango(){
  const n=new Date(hoy()+"T12:00:00");let a,b,label;
  if(S.per==="semana"){const d=new Date(n);d.setDate(d.getDate()-((d.getDay()+6)%7)+S.off*7);a=iso(d);const e=new Date(d);e.setDate(e.getDate()+6);b=iso(e);label=fechaCorta(a)+" – "+fechaCorta(b)}
  else if(S.per==="mes"){const d=new Date(n.getFullYear(),n.getMonth()+S.off,1);a=iso(d);b=iso(new Date(d.getFullYear(),d.getMonth()+1,0));label=MESES[d.getMonth()]+" "+d.getFullYear()}
  else{const y=n.getFullYear()+S.off;a=y+"-01-01";b=y+"-12-31";label=String(y)}
  return {a,b,label:label[0].toUpperCase()+label.slice(1)};
}
function vStats(){
  const r=rango(),gs=S.movs.filter(m=>m.tipo==="gasto"&&m.fecha>=r.a&&m.fecha<=r.b);
  const tot=sum(gs,m=>+m.monto);
  const by={};gs.forEach(m=>by[m.cat]=(by[m.cat]||0)+ +m.monto);
  const col=n=>(S.cats.find(c=>c.nombre===n)||{color:"#C9D6D5"}).color;
  const lista=Object.entries(by).sort((x,y)=>y[1]-x[1]);
  let acc=0;const stops=lista.map(([n,v])=>{const s=acc/tot*100;acc+=v;return `${col(n)} ${s}% ${acc/tot*100}%`});
  const donut=tot?`background:conic-gradient(${stops.join(",")})`:"background:var(--soft)";
  // barras
  let bk=[];
  if(S.per==="semana"){const d0=dd(r.a);for(let i=0;i<7;i++){const d=new Date(d0);d.setDate(d.getDate()+i);const k=iso(d);bk.push(["LMXJVSD"[i],sum(gs.filter(m=>m.fecha===k),m=>+m.monto)])}}
  else if(S.per==="mes"){const dias=+r.b.slice(8),n=Math.ceil(dias/7);for(let i=0;i<n;i++){bk.push(["S"+(i+1),sum(gs.filter(m=>{const d=+m.fecha.slice(8);return d>i*7&&d<=(i+1)*7}),m=>+m.monto)])}}
  else for(let i=1;i<=12;i++){bk.push([MESES[i-1].slice(0,1).toUpperCase(),sum(gs.filter(m=>+m.fecha.slice(5,7)===i),m=>+m.monto)])}
  const mx=Math.max(...bk.map(b=>b[1]),1),mxi=bk.findIndex(b=>b[1]===Math.max(...bk.map(x=>x[1])));
  const top=lista[0];
  const ins=top?`<b>${esc(top[0])}</b> es lo que más se lleva tu plata: <b>${Math.round(top[1]/tot*100)}%</b> de lo que gastaste (${fm(top[1])} de ${fm(tot)}).`:"Todavía no hay gastos en este periodo. Cuando registres uno, aquí ves en qué se va tu plata.";
  const pn=S.per==="semana"?"esta semana":S.per==="mes"?"este mes":"este año";
  return `<div class="hero"><div class="o"></div><div style="font-size:24px;font-weight:800">Estadísticas</div><div class="row" style="margin-top:4px"><button class="x" style="color:#fff" data-act="off" data-v="-1">‹</button><div style="font-size:13px;font-weight:700;flex:1;text-align:center">${esc(r.label)}</div><button class="x" style="color:#fff" data-act="off" data-v="1">›</button></div>
  <div class="seg">${["semana","mes","año"].map(p=>`<button data-act="per" data-v="${p}" class="${S.per===p?"on":""}">${p[0].toUpperCase()+p.slice(1)}</button>`).join("")}</div></div>
  <div class="pad"><div class="card row" style="gap:16px"><div class="donut" style="${donut}"><i><span class="m">Gastaste</span><b style="font-size:16px">${fm(tot)}</b></i></div><div style="flex:1;display:flex;flex-direction:column;gap:8px">${lista.length?lista.map(([n,v])=>`<div class="row" style="gap:8px;font-size:12.5px"><span class="dot" style="background:${col(n)}"></span><span style="flex:1">${esc(n)}</span><b>${Math.round(v/tot*100)}%</b></div>`).join(""):'<span class="m">Sin gastos</span>'}</div></div>
  <div class="card"><div class="sec"><b>Gasto por ${S.per==="semana"?"día":S.per==="mes"?"semana":"mes"}</b></div><div class="bars">${bk.map((b,i)=>`<div><span style="height:${Math.max(4,b[1]/mx*80)}px;background:${i===mxi&&b[1]>0?"var(--bar-hi)":"var(--bar-lo)"}"></span><span class="m" style="min-height:0;width:auto;font-size:11px">${b[0]}</span></div>`).join("")}</div></div>
  <div class="note" style="border-radius:20px;padding:14px 16px">${ins}</div></div>`;
}

/* ---------- Metas ---------- */
function metaCard(m){
  const ap=S.aportes.filter(a=>a.meta_id===m.id),tot=sum(ap,a=>+a.monto),obj=+m.objetivo;
  const porU={};ap.forEach(a=>{(porU[a.user_id]=porU[a.user_id]||{n:a.nombre,v:0}).v+=+a.monto});
  const cols=["var(--m1)","var(--m2)"];const us=Object.entries(porU).sort(([u])=>u===S.user.id?-1:1);

/* ---------- Exportar a Excel (con los colores de la app) ---------- */
function cargarScript(src){return new Promise((ok,no)=>{if(window.ExcelJS)return ok();const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=()=>no(new Error("No cargó "+src));document.head.appendChild(e)})}
async function exportarExcel(){
  toast("Preparando tu Excel…");
  try{await cargarScript("vendor/exceljs.min.js")}catch(_){toast("No se pudo preparar el Excel");return}
  const cs=getComputedStyle(document.documentElement),cv=(n,d)=>((cs.getPropertyValue(n)||"").trim()||d).replace("#","").toUpperCase();
  const TQ=cv("--tq","8ACDCB"),TQD=cv("--tqd","08807B"),INK=cv("--ink","123F44"),SOFT=cv("--soft","E3F3F1"),BG=cv("--bg","FFF8F0"),MUT=cv("--mut","4F7377");
  const fill=h=>({type:"pattern",pattern:"solid",fgColor:{argb:"FF"+h.replace("#","").toUpperCase()}});
  const lum=h=>{const n=parseInt(h.replace("#",""),16);return 0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255)};
  const txOn=h=>lum(h)>165?INK:"FFFFFF";
  const FONT="Calibri",MON='"$"#,##0';
  const catColor=n=>{const c=S.cats.find(x=>x.nombre===n);return c?c.color.replace("#","").toUpperCase():"B8C9C8"};
  const wb=new ExcelJS.Workbook();wb.creator="Mis Finanzas";wb.created=new Date();
  const hoyS=hoy(),ym=mesAct(),nombre=S.cfg.nombre||"";
  const gastos=S.movs.filter(m=>m.tipo==="gasto"),ingresos=S.movs.filter(m=>m.tipo==="ingreso");
  const delMes=a=>a.filter(m=>ymOf(m.fecha)===ym);

/* ---------- Eventos ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,v=t.dataset.v;
  if(a==="pago")return; // lo maneja change
  if(a==="tab"){S.tab=v;S.det=null;S.off=0;render()}
  else if(a==="det"){S.det=v;render();if(v==="blu"&&S.blu.estado==="ok")refreshBlu(true)}
  else if(a==="back"){S.det=null;render()}
  else if(a==="mov")sheetMov(v);
  else if(a==="delmov")delMov(v);
  else if(a==="editfijo")sheetFijo(v||null);
  else if(a==="per"){S.per=v;S.off=0;render()}
  else if(a==="off"){S.off+=+v;render()}
  else if(a==="newmeta")sheetMeta(null,v);
  else if(a==="editmeta"){const m=S.metas.find(x=>x.id===v);sheetMeta(v,m.tipo)}
  else if(a==="aportar")sheetAporte(v);
  else if(a==="editcat")sheetCat(v||null);
  else if(a==="ajustesaldo")sheetAjusteSaldo();
  else if(a==="ajustesaldoblu")sheetAjusteBlu();
  else if(a==="newcj")sheetCaja(v||null);
  else if(a==="ajustecuenta")sheetAjusteCuenta(v);
  else if(a==="traspaso")sheetTraspaso(v||null);
  else if(a==="deltr"){if(!confirm("¿Borrar este traspaso?"))return;const r=await sb.from("fin_traspasos").delete().eq("id",v);if(r.error){toast("No se pudo borrar");return}S.traspasos=S.traspasos.filter(x=>x.id!==v);render();toast("Borrado")}
  else if(a==="cfgtarjeta")sheetTarjeta();
  else if(a==="pagotarjeta")sheetPagoTarjeta();
  else if(a==="deltp"){if(!confirm("¿Borrar este pago?"))return;const r=await sb.from("fin_tarjeta_pagos").delete().eq("id",v);if(r.error){toast("No se pudo borrar");return}S.tpagos=S.tpagos.filter(x=>x.id!==v);render();toast("Borrado")}
  else if(a==="excel")exportarExcel();
  else if(a==="cjmov"){const [i,sg]=v.split("|");sheetCjMov(i,sg)}
  else if(a==="delcm"){if(!confirm("¿Borrar este movimiento?"))return;const r=await sb.from("fin_cajita_movs").delete().eq("id",v);if(r.error){toast("No se pudo borrar");return}S.cmovs=S.cmovs.filter(x=>x.id!==v);render();toast("Borrado")}
  else if(a==="savetope"){const r=await sb.from("fin_config").update({tope_semanal:num($("#tp").value)}).eq("user_id",S.user.id).select().single();if(r.error){toast("No se guardó");return}S.cfg=r.data;render();toast("Tope guardado")}
  else if(a==="copy"){try{await navigator.clipboard.writeText(v);toast("Copiado")}catch(_){toast("Mantén presionado el texto para copiar")}}
  else if(a==="savetasas"){const row={tasa_blu:num($("#tb").value),tasa_sueldo:num($("#ts").value),hornea_pct:num($("#hp").value)};const r=await sb.from("fin_config").update(row).eq("user_id",S.user.id).select().single();if(r.error){toast("No se guardó");return}S.cfg=r.data;await cargarBlu();render();toast("Guardado")}
  else if(a==="bluin"){const r=await bluSb.auth.signInWithPassword({email:$("#be").value.trim(),password:$("#bp").value});if(r.error){$("#bm").textContent="Correo o contraseña incorrectos.";return}await cargarBlu();render()}
  else if(a==="blurefresh")refreshBlu();
  else if(a==="bluout"){await bluSb.auth.signOut();S.blu={estado:"login",saldo:null,movs:[],msg:""};render();toast("Blu desconectado")}
  else if(a==="logout"){aplicarTema();await sb.auth.signOut();await bluSb.auth.signOut();S.user=null;vLogin()}
});
